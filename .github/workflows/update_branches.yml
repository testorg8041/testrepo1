name: Update Branches

on:
  workflow_dispatch:
    inputs:
      repositories:
        description: testrepo1
        required: false
        default: ''

jobs:
  update-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install gh -y

      - name: Authenticate GitHub CLI
        run: |
          echo "${{ secrets.PAT }}" | gh auth login --with-token
        env:
          PAT: ${{ secrets.PAT }}

      - name: Run branch update script for selected repositories
        run: |
          chmod +x scripts/create-protect-branch.sh
          if [ -z "${{ github.event.inputs.repositories }}" ]; then
            scripts/create-protect-branch.sh testorg8041 "${{ secrets.PAT }}"
          else
            repos=$(echo "${{ github.event.inputs.repositories }}" | tr ',' ' ')
            scripts/create-protect-branch.sh testorg8041 "${{ secrets.PAT }}" $repos
          fi
        env:
          PAT: ${{ secrets.PAT }}
