name: Update Branches

# This workflow requires a Personal Access Token (PAT) with the following scopes:
# - repo (Full control of private repositories)
# - admin:org (Full control of orgs and teams, read and write org projects)
#
# To set up:
# 1. Create a PAT at https://github.com/settings/tokens with the scopes above
# 2. Add the PAT as a repository secret named 'PAT' in your repository settings
#    (Settings > Secrets and variables > Actions > New repository secret)

on:
  workflow_dispatch: # Allows manual triggering

jobs:
  update-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install gh -y

      - name: Authenticate GitHub CLI
        run: |
          sudo apt update
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Run branch update script
        run: scripts/create-protect-branch.sh testorg8041
