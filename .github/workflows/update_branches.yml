name: Update Branches

on:
  workflow_dispatch:

jobs:
  update-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install gh -y

      - name: Authenticate GitHub CLI
        run: |
          echo "${{ secrets.PAT }}" | gh auth login --with-token

      - name: Run branch update script
        run: |
          chmod +x scripts/create-protect-branch.sh
          scripts/create-protect-branch.sh testorg8041 "${{ secrets.PAT }}"
        env:
          PAT: ${{ secrets.PAT }}
